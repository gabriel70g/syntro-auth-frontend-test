name: CI

# Gate de la ficha (.claude/rules/00-sf-gate.md): audit de dependencias de producción + lint + build.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versión: packageManager de package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: python3 scripts/check-contrast.py # WCAG AA de los tokens, modo claro y oscuro
      - run: pnpm lint
      - run: pnpm build
